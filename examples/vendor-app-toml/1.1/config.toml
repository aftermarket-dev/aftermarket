# Vendor App 1.1 configuration.
# This file is replaced on every upgrade.

[server]
port = 8080
timeout = 60        # seconds; raised in 1.1
workers = 4
http2 = true        # new in 1.1

[logging]
level = "info"
format = "json"     # json is the default from 1.1

[telemetry]
enabled = true
endpoint = "https://telemetry.example.com/v2"

[database]
url = "postgres://app@db.internal/app"
password = "vendor-default"
pool = 10

[[jobs]]
name = "cleanup"
schedule = "0 3 * * *"

[[jobs]]
name = "report"
schedule = "0 6 * * 1"
