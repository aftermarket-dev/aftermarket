# Vendor App 1.0 configuration.
# This file is replaced on every upgrade.

[server]
port = 8080
timeout = 30        # seconds
workers = 4

[logging]
level = "info"
format = "text"     # text or json

[telemetry]
enabled = true
endpoint = "https://telemetry.example.com/v1"

[database]
url = "postgres://app@db.internal/app"
password = "vendor-default"
pool = 10

[[jobs]]
name = "cleanup"
schedule = "0 3 * * *"

[[jobs]]
name = "report"
schedule = "0 6 * * 1"
