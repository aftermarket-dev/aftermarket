# Publishes a release when internal/version/version.go holds a version that
# has no tag yet and CI has passed on that commit. Versions ending in -dev are
# never released. Nothing is published unless every build and smoke test
# passes. Archive names carry no version, so
# https://github.com/aftermarket-dev/aftermarket/releases/latest/download/<archive>
# always points at the newest release.
#
# Run it by hand with a tag to rebuild the files of an existing release (or
# to publish a tag whose release is missing).

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (for example v0.1.0); leave empty to release the version on main
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          ref=$(git rev-parse HEAD)
          rebuild=false
          release=true
          if [ "$EVENT" = workflow_dispatch ] && [ -z "$TAG" ]; then
            echo "Run by hand only to rebuild an existing tag. New versions are released by pushing them to main, after CI passes."
            exit 1
          fi
          if [ -n "$TAG" ]; then
            if [ "v$version" != "$TAG" ]; then
              echo "tag $TAG holds version $version"; exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              rebuild=true
            fi
          elif [[ "$version" == *-* ]]; then
            echo "version $version is a development version; nothing to release"
            release=false
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "v$version is already released; nothing to do"
              release=false
            else
              echo "v$version is tagged but has no release yet; publishing it"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "version $version at $ref, release=$release, rebuild=$rebuild"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name=aftermarket_${os}_${arch}
            work=$(mktemp -d)/$name
            mkdir -p "$work"
            exe=aftermarket; [ "$os" = windows ] && exe=aftermarket.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$work/$exe" ./cmd/aftermarket
            cp LICENSE NOTICE README.md THIRD_PARTY_LICENSES.md "$work/"
            mkdir -p "$work/examples/legacy-customer" "$work/examples/customer-api"
            cp examples/legacy-customer/rules.yaml examples/legacy-customer/fixture.yaml "$work/examples/legacy-customer/"
            cp examples/customer-api/adapt.yaml examples/customer-api/fixture.yaml examples/customer-api/record.yaml "$work/examples/customer-api/"
            mkdir -p "$work/examples/vendor-app/1.0" "$work/examples/vendor-app/1.1"
            cp examples/vendor-app/overlay.yaml examples/vendor-app/fixture.yaml "$work/examples/vendor-app/"
            cp examples/vendor-app/1.0/config.json "$work/examples/vendor-app/1.0/"
            cp examples/vendor-app/1.1/config.json "$work/examples/vendor-app/1.1/"
            mkdir -p "$work/examples/vendor-app-toml/1.0" "$work/examples/vendor-app-toml/1.1"
            cp examples/vendor-app-toml/overlay.yaml examples/vendor-app-toml/fixture.yaml "$work/examples/vendor-app-toml/"
            cp examples/vendor-app-toml/1.0/config.toml "$work/examples/vendor-app-toml/1.0/"
            cp examples/vendor-app-toml/1.1/config.toml "$work/examples/vendor-app-toml/1.1/"
            mkdir -p "$work/examples/legacy-app/exports" "$work/examples/legacy-app/receiver"
            cp examples/legacy-app/hook.yaml examples/legacy-app/fixture.yaml examples/legacy-app/status.json "$work/examples/legacy-app/"
            cp examples/legacy-app/receiver/main.go "$work/examples/legacy-app/receiver/"
            mkdir -p "$work/examples/legacy-admin"
            cp examples/legacy-admin/guard.yaml examples/legacy-admin/fixture.yaml "$work/examples/legacy-admin/"
            if [ "$os" = windows ]; then
              (cd "$(dirname "$work")" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
            else
              tar -C "$(dirname "$work")" -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: [plan, build]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            archive: aftermarket_linux_amd64.tar.gz
          - os: ubuntu-24.04-arm
            archive: aftermarket_linux_arm64.tar.gz
          - os: macos-latest
            archive: aftermarket_darwin_arm64.tar.gz
          - os: macos-latest
            archive: aftermarket_darwin_amd64.tar.gz
            prefix: arch -x86_64
          - os: windows-latest
            archive: aftermarket_windows_amd64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Unpack and run
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCHIVE: ${{ matrix.archive }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          case "$ARCHIVE" in
            *.zip) unzip -q "../dist/$ARCHIVE" ;;
            *) tar -xzf "../dist/$ARCHIVE" ;;
          esac
          dir=${ARCHIVE%.tar.gz}; dir=${dir%.zip}
          cd "$dir"
          bin=./aftermarket; [ -f aftermarket.exe ] && bin=./aftermarket.exe
          file "$bin" || true
          out=$($PREFIX "$bin" version | tr -d '\r')
          echo "$out"
          [ "$out" = "aftermarket $VERSION" ]
          $PREFIX "$bin" patch check --config examples/legacy-customer/rules.yaml
          $PREFIX "$bin" patch test --config examples/legacy-customer/rules.yaml --fixture examples/legacy-customer/fixture.yaml
          $PREFIX "$bin" adapt check --config examples/customer-api/adapt.yaml
          $PREFIX "$bin" adapt test --config examples/customer-api/adapt.yaml --fixture examples/customer-api/fixture.yaml
          $PREFIX "$bin" record check --config examples/customer-api/record.yaml
          $PREFIX "$bin" config check --overlay examples/vendor-app/overlay.yaml
          $PREFIX "$bin" config test --overlay examples/vendor-app/overlay.yaml --fixture examples/vendor-app/fixture.yaml
          $PREFIX "$bin" config apply --overlay examples/vendor-app/overlay.yaml --out smoke-config.json
          grep -q '"timeout": 120' smoke-config.json
          # On 1.1 the guards must stop apply and write nothing.
          if $PREFIX "$bin" config apply --overlay examples/vendor-app/overlay.yaml --base examples/vendor-app/1.1/config.json --out smoke-11.json; then exit 1; fi
          [ ! -e smoke-11.json ]
          # TOML: only the changed lines differ, and 1.1 stops apply too.
          $PREFIX "$bin" config test --overlay examples/vendor-app-toml/overlay.yaml --fixture examples/vendor-app-toml/fixture.yaml
          $PREFIX "$bin" config apply --overlay examples/vendor-app-toml/overlay.yaml --out smoke-config.toml
          grep -q '^timeout = 120        # seconds' smoke-config.toml
          grep -q '^# This file is replaced on every upgrade.' smoke-config.toml
          if $PREFIX "$bin" config apply --overlay examples/vendor-app-toml/overlay.yaml --base examples/vendor-app-toml/1.1/config.toml --out smoke-11.toml; then exit 1; fi
          [ ! -e smoke-11.toml ]
          $PREFIX "$bin" hook check --config examples/legacy-app/hook.yaml
          $PREFIX "$bin" hook test --config examples/legacy-app/hook.yaml --fixture examples/legacy-app/fixture.yaml
          # A one-shot run sets a baseline, then queues a change for a webhook
          # that can't be reached, and keeps it for the next run.
          mkdir hooksmoke
          printf 'state: st.json\nsettle: 1ms\nwebhooks:\n  - id: w\n    url: http://127.0.0.1:1/x\nsources:\n  - id: s\n    file: {path: s.json}\n' > hooksmoke/hook.yaml
          echo '{"a":1}' > hooksmoke/s.json
          $PREFIX "$bin" hook run --config hooksmoke/hook.yaml --once --log hooksmoke/log.jsonl
          echo '{"a":2}' > hooksmoke/s.json
          $PREFIX "$bin" hook run --config hooksmoke/hook.yaml --once --log hooksmoke/log.jsonl
          grep -q '"baseline"' hooksmoke/log.jsonl
          grep -q '"changed"' hooksmoke/log.jsonl
          grep -q '"retry"' hooksmoke/log.jsonl
          grep -q '"event_id"' hooksmoke/st.json
          $PREFIX "$bin" guard check --config examples/legacy-admin/guard.yaml
          $PREFIX "$bin" guard test --config examples/legacy-admin/guard.yaml --fixture examples/legacy-admin/fixture.yaml
          # A live guard in front of an app that isn't there: rules decide
          # without it, and what they allow gets a clean 502.
          $PREFIX "$bin" guard run --config examples/legacy-admin/guard.yaml --upstream http://127.0.0.1:1 --listen 127.0.0.1:18080 --log guard.log &
          gpid=$!
          for i in $(seq 1 50); do
            curl -s -o /dev/null http://127.0.0.1:18080/_aftermarket/healthz && break
            sleep 0.2
          done
          code() { curl -s -o /dev/null -w '%{http_code}' --path-as-is "$@"; }
          [ "$(code http://127.0.0.1:18080/_aftermarket/healthz)" = 200 ]
          [ "$(code http://127.0.0.1:18080/debug/env)" = 404 ]
          [ "$(code http://127.0.0.1:18080/admin/users)" = 401 ]
          [ "$(code 'http://127.0.0.1:18080/status/..%2fadmin/users')" = 400 ]
          [ "$(code http://127.0.0.1:18080/status)" = 502 ]
          kill $gpid || true
          grep -q '"event":"denied"' guard.log
          grep -q '"event":"rejected"' guard.log
          # The vendor's file is never written.
          if $PREFIX "$bin" config apply --overlay examples/vendor-app/overlay.yaml --out examples/vendor-app/1.0/config.json; then exit 1; fi

  publish:
    needs: [plan, build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ needs.plan.outputs.ref }}
          REBUILD: ${{ needs.plan.outputs.rebuild }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          notes="docs/releases/$VERSION.md"
          if [ ! -f "$notes" ]; then
            notes=$(mktemp)
            echo "Aftermarket $tag. See the README for what is included." > "$notes"
          fi
          if [ "$REBUILD" = true ]; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$REF" --title "Aftermarket $tag" --notes-file "$notes" --latest
          fi
          gh release view "$tag"
