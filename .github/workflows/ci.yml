name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned to ubuntu-24.04 from Oct 20 to Oct 21 2026 over an "unexpected
        # EOF" that turned out to be a proxy bug, fixed in 0.7.1.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sqlite3 for AfterSchema
        shell: bash
        run: |
          command -v sqlite3 || (sudo apt-get update -q && sudo apt-get install -y -q sqlite3)
          sqlite3 -version
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race detector on)
        shell: bash
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Failures also go to annotations, which can be read without the log.
          grep -E -- '--- FAIL|^FAIL|panic:|_test.go:[0-9]+:|seed [0-9]+' test.log | head -40 | sed 's/^/::error::/'
          exit $status
      - name: Example fixtures
        run: |
          go run ./cmd/aftermarket patch test --config examples/legacy-customer/rules.yaml --fixture examples/legacy-customer/fixture.yaml
          go run ./cmd/aftermarket adapt test --config examples/customer-api/adapt.yaml --fixture examples/customer-api/fixture.yaml
          go run ./cmd/aftermarket record check --config examples/customer-api/record.yaml
          go run ./cmd/aftermarket config check --overlay examples/vendor-app/overlay.yaml
          go run ./cmd/aftermarket config test --overlay examples/vendor-app/overlay.yaml --fixture examples/vendor-app/fixture.yaml
          go run ./cmd/aftermarket hook check --config examples/legacy-app/hook.yaml
          go run ./cmd/aftermarket hook test --config examples/legacy-app/hook.yaml --fixture examples/legacy-app/fixture.yaml
          go run ./cmd/aftermarket config check --overlay examples/vendor-app-toml/overlay.yaml
          go run ./cmd/aftermarket config test --overlay examples/vendor-app-toml/overlay.yaml --fixture examples/vendor-app-toml/fixture.yaml
          go run ./cmd/aftermarket guard check --config examples/legacy-admin/guard.yaml
          go run ./cmd/aftermarket guard test --config examples/legacy-admin/guard.yaml --fixture examples/legacy-admin/fixture.yaml
          cd examples/legacy-shop
          go run ../../cmd/aftermarket schema diff --map map.yaml
          go run ../../cmd/aftermarket schema check --queries reports.sql --map map.yaml
          go run ../../cmd/aftermarket schema test --queries reports.sql --map map.yaml
          cd ../legacy-exports
          go run ../../cmd/aftermarket bridge check --config bridge.yaml
          go run ../../cmd/aftermarket bridge test --config bridge.yaml --fixture fixture.yaml
