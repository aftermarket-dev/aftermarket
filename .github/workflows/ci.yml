name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to Ubuntu 26 on Oct 19 2026, where a test's
        # direct call to its own test server failed with an unexpected EOF.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race detector on)
        shell: bash
        run: |
          set +e
          go test -race -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Failures also go to annotations, which can be read without the log.
          grep -E -- '--- FAIL|^FAIL|panic:|_test.go:[0-9]+:|seed [0-9]+' test.log | head -40 | sed 's/^/::error::/'
          exit $status
      - name: Example fixtures
        run: |
          go run ./cmd/aftermarket patch test --config examples/legacy-customer/rules.yaml --fixture examples/legacy-customer/fixture.yaml
          go run ./cmd/aftermarket adapt test --config examples/customer-api/adapt.yaml --fixture examples/customer-api/fixture.yaml
          go run ./cmd/aftermarket record check --config examples/customer-api/record.yaml
          go run ./cmd/aftermarket config check --overlay examples/vendor-app/overlay.yaml
          go run ./cmd/aftermarket config test --overlay examples/vendor-app/overlay.yaml --fixture examples/vendor-app/fixture.yaml
          go run ./cmd/aftermarket hook check --config examples/legacy-app/hook.yaml
          go run ./cmd/aftermarket hook test --config examples/legacy-app/hook.yaml --fixture examples/legacy-app/fixture.yaml
          go run ./cmd/aftermarket guard check --config examples/legacy-admin/guard.yaml
          go run ./cmd/aftermarket guard test --config examples/legacy-admin/guard.yaml --fixture examples/legacy-admin/fixture.yaml
